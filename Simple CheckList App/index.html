<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Simple Checlist App</title>
      <link rel="stylesheet" href="styles.css">
</head>
<body>

      <div class="checklist-container">
            <div class="checlist-bar">
                  <input type="range" id="range-bar" min="0" max="5" value="0">
            </div>
            <div class="checklist-content-1">
                  <input type="checkbox" class="check"/> <span class="check">Task One Completed</span>
            </div>

            <div class="checklist-content-1">
                  <input type="checkbox" class="check"/> <span class="check">Task One Completed</span>
            </div>

            <div class="checklist-content-1">
                  <input type="checkbox" class="check"/> <span class="check">Task One Completed</span>
            </div>

            <div class="checklist-content-1">
                  <input type="checkbox" class="check"/> <span class="check">Task One Completed</span>
            </div>

            <div class="checklist-content-1">
                  <input type="checkbox" class="check"/> <span class="check">Task One Completed</span>
            </div>

      </div>
      
      <script src="script.js" ></script>
</body>
</html>
